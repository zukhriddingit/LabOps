version: "3.1"

# Optional Rasa Pro/CALM configuration for the hackathon starter stack.
# Keep config.yml for the reliable classic NLU shell demo.
recipe: default.v1
assistant_id: labops-guardian-calm
language: en

pipeline:
  - name: CompactLLMCommandGenerator
    llm:
      model_group: nebius-command-generator

policies:
  - name: FlowPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: utter_fallback
    enable_fallback_prediction: true
