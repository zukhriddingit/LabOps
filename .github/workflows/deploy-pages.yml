name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/3d-lab-demo
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "web_demo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_demo/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static frontend
        run: npm run build
        env:
          NEXT_PUBLIC_LABOPS_API_URL: https://zukhriddinai-labops-guardian-api.hf.space
          NEXT_PUBLIC_VOICE_GATEWAY_URL: https://zukhriddinai-labops-guardian-api.hf.space

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_demo/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
